; Production overrides (loaded after php.ini-production)
expose_php = Off
memory_limit = 256M
max_execution_time = 60

; Product images are validated at max 2 MB; leave headroom for the multipart body
upload_max_filesize = 4M
post_max_size = 8M

; OPcache: code never changes inside a running container
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
