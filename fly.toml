app = "penpal"
kill_signal = "SIGINT"
kill_timeout = 5

[build]
  image = "Dockerfile"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls"]
    port = 443

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20
