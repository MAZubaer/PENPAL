# Render Blueprint: https://render.com/docs/blueprint-spec
# Dashboard > New > Blueprint > pick this repo. Values marked `sync: false` are
# secrets: Render prompts for them on first creation and never stores them in git.
services:
  - type: web
    name: penpal
    runtime: docker
    region: singapore          # same region as the Neon DB (aws ap-southeast-1)
    plan: free                 # change to starter (or higher) for always-on
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      # --- secrets (entered in the Render dashboard) ---
      - key: APP_KEY           # php artisan key:generate --show
        sync: false
      - key: DATABASE_URL      # Neon pooled connection string (…-pooler…, sslmode=require)
        sync: false
      - key: CLOUDINARY_URL    # cloudinary://<api_key>:<api_secret>@<cloud_name>
        sync: false

      # --- app ---
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # APP_URL defaults to RENDER_EXTERNAL_URL (see docker/start.sh); set it for a custom domain.
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info

      # --- database (Neon PostgreSQL) ---
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require

      # --- sessions / cache / queue (all in Postgres; no worker on the free plan) ---
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync

      # --- mail: "log" only writes to the logs. Configure SMTP for password-reset emails. ---
      - key: MAIL_MAILER
        value: log

      # Migrations run at container start (free plan has no pre-deploy command)
      - key: RUN_MIGRATIONS
        value: "true"
